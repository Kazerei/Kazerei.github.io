<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skin 3D Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  body { background:#07030d; color:#e2e8f0; font-family:sans-serif; margin:0; padding:16px; }
  .row { display:flex; gap:8px; margin-bottom:12px; align-items:center; }
  input[type=text] { flex:1; padding:8px; border-radius:6px; border:1px solid #2a164f; background:#120924; color:#fff; }
  button { padding:8px 14px; border-radius:6px; border:0; background:#8b5cf6; color:#fff; cursor:pointer; }
  #viewer { width:100%; height:380px; background:#120924; border:1px solid #2a164f; border-radius:12px; touch-action:none; cursor:grab; }
  #status { font-size:12px; color:#a855f7; min-height:18px; margin:8px 0; }
  #preview { width:128px; image-rendering:pixelated; border:1px solid #2a164f; background:#120924; }
  .poses label { display:block; font-size:12px; margin:6px 0; }
  .poses input { width:100%; }
</style>
</head>
<body>

<div class="row">
  <input type="text" id="uuid" placeholder="UUID（ハイフンあり・なしどちらでも可）">
  <button id="go">表示</button>
</div>
<div id="status"></div>
<div id="viewer"></div>

<div class="row"><img id="preview" alt="skin"></div>

<div class="poses">
  <label>右腕 <input type="range" min="-90" max="90" value="0" data-part="rArm"></label>
  <label>左腕 <input type="range" min="-90" max="90" value="0" data-part="lArm"></label>
  <label>右脚 <input type="range" min="-90" max="90" value="0" data-part="rLeg"></label>
  <label>左脚 <input type="range" min="-90" max="90" value="0" data-part="lLeg"></label>
</div>

<script>
const WORKER_URL = "https://system.clytiers.workers.dev";

const viewer = document.getElementById("viewer");
const statusEl = document.getElementById("status");
const uuidInput = document.getElementById("uuid");
const previewEl = document.getElementById("preview");

let renderer, scene, camera, model;
const parts = {};

/* ---------- 3D初期化 ---------- */
function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  viewer.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(35, 1, 1, 1000);
  camera.position.set(0, 16, 120);
  camera.lookAt(0, 16, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dl = new THREE.DirectionalLight(0xffffff, 0.6);
  dl.position.set(1, 2, 3);
  scene.add(dl);

  model = new THREE.Group();
  scene.add(model);

  resize();
  window.addEventListener("resize", resize);

  // ドラッグで回転
  let dragging = false, lastX = 0;
  viewer.addEventListener("pointerdown", e => {
    dragging = true; lastX = e.clientX;
    viewer.setPointerCapture(e.pointerId);
  });
  viewer.addEventListener("pointermove", e => {
    if (!dragging) return;
    model.rotation.y += (e.clientX - lastX) * 0.01;
    lastX = e.clientX;
  });
  const endDrag = () => { dragging = false; };
  viewer.addEventListener("pointerup", endDrag);
  viewer.addEventListener("pointercancel", endDrag);

  animate();
}

function resize() {
  const w = viewer.clientWidth, h = viewer.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

/* ---------- スキンのUV割り当て ---------- */
// 1ピクセル = 1ユニット。原点は腰の中央（足元が y=0、頭頂が y=32）
// 面の順番は BoxGeometry と同じ [+x, -x, +y, -y, +z, -z]
// +x = キャラの左側, -x = キャラの右側（正面は +z）
function rectsFor(u, v, w, h, d) {
  const R = {
    right:  { x: u,         y: v + d, w: d, h: h },
    left:   { x: u + d + w, y: v + d, w: d, h: h },
    top:    { x: u + d,     y: v,     w: w, h: d },
    bottom: { x: u + d + w, y: v,     w: w, h: d },
    front:  { x: u + d,     y: v + d, w: w, h: h },
    back:   { x: u + 2 * d + w, y: v + d, w: w, h: h }
  };
  return [R.left, R.right, R.top, R.bottom, R.front, R.back];
}

function remapUV(geom, rects) {
  const uv = geom.attributes.uv;
  for (let f = 0; f < 6; f++) {
    const r = rects[f];
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k;
      const a = uv.getX(i), b = uv.getY(i);
      const px = r.x + a * r.w;
      const py = r.y + (1 - b) * r.h;
      uv.setXY(i, px / 64, 1 - py / 64);
    }
  }
  uv.needsUpdate = true;
}

function makePart(w, h, d, u, v, inflate, x, y, mat) {
  const g = new THREE.BoxGeometry(w + inflate * 2, h + inflate * 2, d + inflate * 2);
  remapUV(g, rectsFor(u, v, w, h, d));
  const m = new THREE.Mesh(g, mat);
  m.position.set(x, y, 0);
  return m;
}

// 肩・股関節を支点にした関節グループ
function limb(pivotX, pivotY, w, base, over, mat, omat) {
  const p = new THREE.Group();
  p.position.set(pivotX, pivotY, 0);
  p.add(
    makePart(w, 12, 4, base[0], base[1], 0, 0, -6, mat),
    makePart(w, 12, 4, over[0], over[1], 0.25, 0, -6, omat)
  );
  return p;
}

/* ---------- モデル構築 ---------- */
function buildModel(tex, slim) {
  while (model.children.length) model.remove(model.children[0]);

  const mat  = new THREE.MeshLambertMaterial({ map: tex });
  const omat = new THREE.MeshLambertMaterial({ map: tex, alphaTest: 0.5 });
  const aw = slim ? 3 : 4; // Slim は腕が3px幅

  // 頭
  model.add(
    makePart(8, 8, 8, 0, 0, 0, 0, 28, mat),
    makePart(8, 8, 8, 32, 0, 0.25, 0, 28, omat)
  );
  // 胴
  model.add(
    makePart(8, 12, 4, 16, 16, 0, 0, 18, mat),
    makePart(8, 12, 4, 16, 32, 0.25, 0, 18, omat)
  );

  parts.rArm = limb(-(4 + aw / 2), 24, aw, [40, 16], [40, 32], mat, omat);
  parts.lArm = limb( (4 + aw / 2), 24, aw, [32, 48], [48, 48], mat, omat);
  parts.rLeg = limb(-2, 12, 4, [0, 16], [0, 32], mat, omat);
  parts.lLeg = limb( 2, 12, 4, [16, 48], [0, 48], mat, omat);
  model.add(parts.rArm, parts.lArm, parts.rLeg, parts.lLeg);

  applyPose();
}

/* ---------- ポーズ ---------- */
function applyPose() {
  document.querySelectorAll("[data-part]").forEach(s => {
    const p = parts[s.dataset.part];
    if (p) p.rotation.x = THREE.MathUtils.degToRad(+s.value);
  });
}
document.querySelectorAll("[data-part]").forEach(s =>
  s.addEventListener("input", applyPose)
);

/* ---------- スキン取得 ---------- */
function setStatus(msg) { statusEl.textContent = msg; }

async function showSkin() {
  const clean = uuidInput.value.trim().replace(/-/g, "").toLowerCase();
  if (!/^[0-9a-f]{32}$/.test(clean)) {
    setStatus("UUIDの形式が正しくありません");
    return;
  }

  setStatus("読み込み中...");
  try {
    const res = await fetch(`${WORKER_URL}?action=skin&uuid=${clean}`);
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.message || `取得に失敗しました (${res.status})`);
    }

    const slim = res.headers.get("X-Skin-Model") === "slim";
    const objUrl = URL.createObjectURL(await res.blob());
    previewEl.src = objUrl;

    const tex = await new Promise((ok, err) =>
      new THREE.TextureLoader().load(objUrl, ok, undefined, err)
    );
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;

    buildModel(tex, slim);
    setStatus(slim ? "Slim（細腕）モデル" : "Classic（通常）モデル");
  } catch (e) {
    setStatus("エラー: " + e.message);
  }
}

document.getElementById("go").addEventListener("click", showSkin);
uuidInput.addEventListener("keydown", e => { if (e.key === "Enter") showSkin(); });

init();
</script>
</body>
</html>
