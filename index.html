
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelCode - 画像コード変換</title>
<style>
:root{color-scheme:dark;--bg:#090c14;--panel:#141b2a;--line:#2b3850;--text:#edf2ff;--muted:#9ba9c2;--accent:#8b7cff;--green:#45d6a1;--red:#ff7181}
*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1050px;margin:auto}h1{margin:0;font-size:27px}.lead{margin:4px 0 20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{min-width:0;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:15px}
h2{margin:0 0 13px;font-size:18px}.picker{display:block;padding:19px;text-align:center;border:1px dashed #657394;border-radius:11px;background:#0d1422;cursor:pointer}.picker:hover{border-color:var(--accent)}
input[type=file]{display:none}.preview{min-height:190px;margin-top:12px;padding:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);border-radius:10px;background-color:#0e1420;background-image:linear-gradient(45deg,#263147 25%,transparent 25%),linear-gradient(-45deg,#263147 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#263147 75%),linear-gradient(-45deg,transparent 75%,#263147 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.preview img{display:block;max-width:100%;max-height:340px;object-fit:contain;image-rendering:auto}.placeholder{color:var(--muted);font-size:13px;text-align:center}
.meta{margin-top:8px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
textarea{display:block;width:100%;min-height:165px;margin-top:12px;padding:12px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:#090f1b;color:#e4ebff;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{padding:10px 15px;border:0;border-radius:9px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:#2a3852}button:disabled{opacity:.45;cursor:not-allowed}
.status{margin-top:10px;padding:10px 12px;border-radius:9px;background:#1c273b;color:var(--muted);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.status.good{color:var(--green)}.status.bad{color:var(--red)}
.note{margin-top:16px;color:var(--muted);font-size:12px}
@media(max-width:760px){body{padding:13px}.grid{grid-template-columns:1fr}h1{font-size:23px}.panel{padding:14px}}
</style>
</head>
<body>
<main>
  <h1>PixelCode</h1>
  <p class="lead">画像を画質そのままコード化。コードから元ファイルを復元できます。</p>

  <div class="grid">
    <section class="panel">
      <h2>① 画像を選択してコード化</h2>
      <label class="picker" for="imageFile">画像を選択する<br><span class="meta">PNG / WebP / JPEG / GIF など</span></label>
      <input id="imageFile" type="file" accept="image/*">
      <div class="preview" id="sourcePreview"><span class="placeholder">ここに選択した画像が表示されます</span></div>
      <div class="meta" id="sourceInfo">まだ画像は選択されていません。</div>
      <div class="actions">
        <button id="encodeButton" disabled>コードに変換</button>
        <button id="copyButton" class="secondary" disabled>コードをコピー</button>
      </div>
      <textarea id="encodedCode" spellcheck="false" placeholder="変換後のコードがここに表示されます。"></textarea>
      <div class="status" id="encodeStatus">まず画像を選択してください。</div>
    </section>

    <section class="panel">
      <h2>② コードから画像を復元</h2>
      <textarea id="inputCode" spellcheck="false" placeholder="PCD2: から始まるコードをここに貼り付けてください。"></textarea>
      <div class="actions">
        <button id="decodeButton">デコード</button>
        <button id="saveButton" class="secondary" disabled>復元画像を保存</button>
      </div>
      <div class="preview" id="resultPreview"><span class="placeholder">復元した画像がここに表示されます</span></div>
      <div class="meta" id="resultInfo">まだ画像は復元されていません。</div>
      <div class="status" id="decodeStatus">コードを貼り付けて「デコード」を押してください。</div>
    </section>
  </div>

  <p class="note">画像ファイルの元データをそのまま可逆圧縮します。画像の再描画・リサイズ・減色は行いません。透過情報や元ファイルの画素データを保持します。Base64は使用しません。50,000文字を超えた場合も、画質を落とさずコードを表示します。</p>
</main>

<script>
"use strict";
(() => {
  const MAX_CODE_LENGTH = 50000;
  const ALPHABET = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$%&()*+-;<=>?@^_`{|}~";
  const $ = id => document.getElementById(id);

  let selectedFile = null;
  let selectedObjectURL = null;
  let restoredBlob = null;
  let restoredObjectURL = null;
  let restoredFileName = "restored-image";

  function status(id, message, kind = "") {
    const el = $(id);
    el.textContent = message;
    el.className = "status" + (kind ? " " + kind : "");
  }

  function bytesTo85(bytes) {
    let output = "";
    for (let offset = 0; offset < bytes.length; offset += 4) {
      const count = Math.min(4, bytes.length - offset);
      let value = 0n;
      for (let i = 0; i < 4; i++) {
        value = (value << 8n) | BigInt(i < count ? bytes[offset + i] : 0);
      }
      let encoded = "";
      for (let i = 0; i < 5; i++) {
        encoded = ALPHABET[Number(value % 85n)] + encoded;
        value /= 85n;
      }
      output += String(count) + encoded;
    }
    return output;
  }

  function base85ToBytes(text) {
    const clean = text.replace(/\s+/g, "");
    if (!clean || clean.length % 6 !== 0) {
      throw new Error("コードの文字数または形式が正しくありません。");
    }
    const output = [];
    for (let offset = 0; offset < clean.length; offset += 6) {
      const count = Number(clean[offset]);
      if (!Number.isInteger(count) || count < 1 || count > 4) {
        throw new Error("コード内のブロック情報が不正です。");
      }
      if (offset + 6 < clean.length && count !== 4) {
        throw new Error("途中のブロック長が不正です。");
      }
      let value = 0n;
      for (let i = 1; i <= 5; i++) {
        const digit = ALPHABET.indexOf(clean[offset + i]);
        if (digit < 0) throw new Error("コードに使用できない文字があります。");
        value = value * 85n + BigInt(digit);
      }
      if (value > 0xffffffffn) throw new Error("コードの数値が範囲外です。");
      const block = new Uint8Array(4);
      for (let i = 3; i >= 0; i--) {
        block[i] = Number(value & 255n);
        value >>= 8n;
      }
      for (let i = 0; i < count; i++) output.push(block[i]);
    }
    return new Uint8Array(output);
  }

  async function deflate(bytes) {
    if (!("CompressionStream" in window)) {
      throw new Error("このブラウザは圧縮機能に対応していません。Safari / Chromeを最新版にしてください。");
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function inflate(bytes) {
    if (!("DecompressionStream" in window)) {
      throw new Error("このブラウザは解凍機能に対応していません。Safari / Chromeを最新版にしてください。");
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  function buildPayload(file) {
    const mime = new TextEncoder().encode(file.type || "application/octet-stream");
    const name = new TextEncoder().encode(file.name || "image");
    if (mime.length > 255 || name.length > 65535) throw new Error("ファイル情報が長すぎます。");
    return file.arrayBuffer().then(buffer => {
      const data = new Uint8Array(buffer);
      const headerLength = 4 + 1 + 2 + 4;
      const output = new Uint8Array(headerLength + mime.length + name.length + data.length);
      output.set([80, 67, 68, 50], 0);
      output[4] = mime.length;
      const view = new DataView(output.buffer);
      view.setUint16(5, name.length, false);
      view.setUint32(7, data.length, false);
      let position = headerLength;
      output.set(mime, position); position += mime.length;
      output.set(name, position); position += name.length;
      output.set(data, position);
      return output;
    });
  }

  function parsePayload(bytes) {
    if (bytes.length < 11 || bytes[0] !== 80 || bytes[1] !== 67 || bytes[2] !== 68 || bytes[3] !== 50) {
      throw new Error("データ識別子が違います。コードが正しいか確認してください。");
    }
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const mimeLength = bytes[4];
    const nameLength = view.getUint16(5, false);
    const dataLength = view.getUint32(7, false);
    const expectedLength = 11 + mimeLength + nameLength + dataLength;
    if (expectedLength !== bytes.length) {
      throw new Error("データサイズが一致しません。コードが途中で欠けている可能性があります。");
    }
    let position = 11;
    const decoder = new TextDecoder();
    const mime = decoder.decode(bytes.slice(position, position + mimeLength)); position += mimeLength;
    const name = decoder.decode(bytes.slice(position, position + nameLength)); position += nameLength;
    const data = bytes.slice(position);
    return { mime: mime || "application/octet-stream", name: name || "restored-image", data };
  }

  function showImage(container, url) {
    container.replaceChildren();
    const image = document.createElement("img");
    image.alt = "選択または復元した画像";
    image.src = url;
    container.appendChild(image);
  }

  $("imageFile").addEventListener("change", () => {
    const file = $("imageFile").files && $("imageFile").files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      status("encodeStatus", "画像ファイルを選択してください。", "bad");
      return;
    }
    selectedFile = file;
    if (selectedObjectURL) URL.revokeObjectURL(selectedObjectURL);
    selectedObjectURL = URL.createObjectURL(file);
    showImage($("sourcePreview"), selectedObjectURL);
    $("sourceInfo").textContent =
      `選択中：${file.name} / ${file.type || "形式不明"} / ${file.size.toLocaleString()} bytes`;
    $("encodeButton").disabled = false;
    $("encodedCode").value = "";
    $("copyButton").disabled = true;
    status("encodeStatus", "選択した画像をプレビューに表示しました。コードに変換できます。", "good");
  });

  $("encodeButton").addEventListener("click", async () => {
    if (!selectedFile) return;
    const button = $("encodeButton");
    button.disabled = true;
    try {
      status("encodeStatus", "元画像データを読み込み、可逆圧縮しています...");
      const payload = await buildPayload(selectedFile);
      const compressed = await deflate(payload);
      const code = "PCD2:" + bytesTo85(compressed);
      $("encodedCode").value = code;
      $("copyButton").disabled = false;
      const length = code.length;
      const limitMessage = length <= MAX_CODE_LENGTH
        ? "50,000文字以内です。"
        : "50,000文字を超えています。画質を維持したまま短縮できるとは限りません。";
      status("encodeStatus",
        `変換完了！\n画像：${selectedFile.name}\n元ファイル：${selectedFile.size.toLocaleString()} bytes\n圧縮後コード：${length.toLocaleString()} 文字\n${limitMessage}`,
        length <= MAX_CODE_LENGTH ? "good" : "bad");
    } catch (error) {
      status("encodeStatus", error.message || String(error), "bad");
    } finally {
      button.disabled = false;
    }
  });

  $("copyButton").addEventListener("click", async () => {
    const code = $("encodedCode").value;
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code);
      status("encodeStatus", "コードをコピーしました！", "good");
    } catch {
      $("encodedCode").focus();
      $("encodedCode").select();
      status("encodeStatus", "コードを選択しました。コピー操作をしてください。");
    }
  });

  $("decodeButton").addEventListener("click", async () => {
    const button = $("decodeButton");
    button.disabled = true;
    try {
      status("decodeStatus", "コードを確認して画像データを復元しています...");
      const input = $("inputCode").value.trim();
      if (!input.startsWith("PCD2:")) throw new Error("PCD2: から始まるコードを貼り付けてください。");
      const compressed = base85ToBytes(input.slice(5));
      const payload = await inflate(compressed);
      const result = parsePayload(payload);
      restoredBlob = new Blob([result.data], { type: result.mime });
      restoredFileName = result.name;
      if (restoredObjectURL) URL.revokeObjectURL(restoredObjectURL);
      restoredObjectURL = URL.createObjectURL(restoredBlob);
      showImage($("resultPreview"), restoredObjectURL);
      $("resultInfo").textContent =
        `復元完了：${result.name} / ${result.mime} / ${result.data.length.toLocaleString()} bytes`;
      $("saveButton").disabled = false;
      status("decodeStatus", "デコード成功！元ファイルのバイナリをそのまま復元しました。", "good");
    } catch (error) {
      status("decodeStatus", error.message || String(error), "bad");
      $("saveButton").disabled = true;
    } finally {
      button.disabled = false;
    }
  });

  $("saveButton").addEventListener("click", () => {
    if (!restoredBlob || !restoredObjectURL) return;
    const link = document.createElement("a");
    link.href = restoredObjectURL;
    link.download = restoredFileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
  });
})();
</script>
</body>
</html>
