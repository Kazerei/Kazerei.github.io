<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skin 3D Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  body { background:#07030d; color:#e2e8f0; font-family:sans-serif; margin:0; padding:16px; }
  .row { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  input[type=text] { flex:1; min-width:0; padding:10px; border-radius:6px; border:1px solid #2a164f; background:#120924; color:#fff; font-size:16px; }
  button { padding:10px 16px; border-radius:6px; border:0; background:#8b5cf6; color:#fff; font-size:15px; cursor:pointer; }
  #viewer { width:100%; height:360px; background:#120924; border:1px solid #2a164f; border-radius:12px; touch-action:none; cursor:grab; }
  #status { font-size:14px; margin:10px 0; min-height:40px; white-space:pre-wrap; word-break:break-all; color:#a855f7; }
  #preview { width:96px; image-rendering:pixelated; border:1px solid #2a164f; background:#120924; }
  .poses label { display:block; font-size:13px; margin:6px 0; }
  .poses input { width:100%; }
</style>
</head>
<body>

<div class="row">
  <input type="text" id="query" placeholder="MCID または UUID">
  <button id="go">表示</button>
</div>
<div id="status"></div>
<div id="viewer"></div>
<div class="row"><img id="preview" alt="skin"></div>

<div class="poses">
  <label>右腕 <input type="range" min="-90" max="90" value="0" data-part="rArm"></label>
  <label>左腕 <input type="range" min="-90" max="90" value="0" data-part="lArm"></label>
  <label>右脚 <input type="range" min="-90" max="90" value="0" data-part="rLeg"></label>
  <label>左脚 <input type="range" min="-90" max="90" value="0" data-part="lLeg"></label>
</div>

<script>
/* ---------- スキンの取得元（上から順に試す） ---------- */
// crafatarはMCIDでもUUIDでも指定できる
const SOURCES = [
  id => `https://crafatar.com/skins/${id}`,
  id => `https://mc-heads.net/skin/${id}`,
  id => `https://corsproxy.io/?${encodeURIComponent(`https://crafatar.com/skins/${id}`)}`
];

const viewer = document.getElementById("viewer");
const statusEl = document.getElementById("status");
const queryInput = document.getElementById("query");
const previewEl = document.getElementById("preview");

let renderer, scene, camera, model;
const parts = {};

function setStatus(msg, isErr) {
  statusEl.textContent = msg;
  statusEl.style.color = isErr ? "#f87171" : "#a855f7";
}

/* ---------- 3D初期化 ---------- */
function init() {
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) {
    setStatus("この端末では3D表示（WebGL）が使えません: " + e.message, true);
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  viewer.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(35, 1, 1, 1000);
  camera.position.set(0, 16, 120);
  camera.lookAt(0, 16, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dl = new THREE.DirectionalLight(0xffffff, 0.6);
  dl.position.set(1, 2, 3);
  scene.add(dl);

  model = new THREE.Group();
  scene.add(model);

  resize();
  window.addEventListener("resize", resize);

  let dragging = false, lastX = 0;
  viewer.addEventListener("pointerdown", e => {
    dragging = true; lastX = e.clientX;
    viewer.setPointerCapture(e.pointerId);
  });
  viewer.addEventListener("pointermove", e => {
    if (!dragging) return;
    model.rotation.y += (e.clientX - lastX) * 0.01;
    lastX = e.clientX;
  });
  const endDrag = () => { dragging = false; };
  viewer.addEventListener("pointerup", endDrag);
  viewer.addEventListener("pointercancel", endDrag);

  animate();
}

function resize() {
  const w = viewer.clientWidth, h = viewer.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

/* ---------- UV割り当て ---------- */
// 面の順番は BoxGeometry と同じ [+x, -x, +y, -y, +z, -z]
function rectsFor(u, v, w, h, d) {
  const R = {
    right:  { x: u,             y: v + d, w: d, h: h },
    left:   { x: u + d + w,     y: v + d, w: d, h: h },
    top:    { x: u + d,         y: v,     w: w, h: d },
    bottom: { x: u + d + w,     y: v,     w: w, h: d },
    front:  { x: u + d,         y: v + d, w: w, h: h },
    back:   { x: u + 2 * d + w, y: v + d, w: w, h: h }
  };
  return [R.left, R.right, R.top, R.bottom, R.front, R.back];
}

function remapUV(geom, rects) {
  const uv = geom.attributes.uv;
  for (let f = 0; f < 6; f++) {
    const r = rects[f];
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k;
      const a = uv.getX(i), b = uv.getY(i);
      const px = r.x + a * r.w;
      const py = r.y + (1 - b) * r.h;
      uv.setXY(i, px / 64, 1 - py / 64);
    }
  }
  uv.needsUpdate = true;
}

function makePart(w, h, d, u, v, inflate, x, y, mat) {
  const g = new THREE.BoxGeometry(w + inflate * 2, h + inflate * 2, d + inflate * 2);
  remapUV(g, rectsFor(u, v, w, h, d));
  const m = new THREE.Mesh(g, mat);
  m.position.set(x, y, 0);
  return m;
}

function limb(pivotX, pivotY, w, base, over, mat, omat) {
  const p = new THREE.Group();
  p.position.set(pivotX, pivotY, 0);
  p.add(
    makePart(w, 12, 4, base[0], base[1], 0, 0, -6, mat),
    makePart(w, 12, 4, over[0], over[1], 0.25, 0, -6, omat)
  );
  return p;
}

/* ---------- モデル構築 ---------- */
function buildModel(tex, slim) {
  while (model.children.length) model.remove(model.children[0]);

  const mat  = new THREE.MeshLambertMaterial({ map: tex });
  const omat = new THREE.MeshLambertMaterial({ map: tex, alphaTest: 0.5, transparent: true });
  const aw = slim ? 3 : 4;

  model.add(
    makePart(8, 8, 8, 0, 0, 0, 0, 28, mat),
    makePart(8, 8, 8, 32, 0, 0.25, 0, 28, omat)
  );
  model.add(
    makePart(8, 12, 4, 16, 16, 0, 0, 18, mat),
    makePart(8, 12, 4, 16, 32, 0.25, 0, 18, omat)
  );

  parts.rArm = limb(-(4 + aw / 2), 24, aw, [40, 16], [40, 32], mat, omat);
  parts.lArm = limb( (4 + aw / 2), 24, aw, [32, 48], [48, 48], mat, omat);
  parts.rLeg = limb(-2, 12, 4, [0, 16], [0, 32], mat, omat);
  parts.lLeg = limb( 2, 12, 4, [16, 48], [0, 48], mat, omat);
  model.add(parts.rArm, parts.lArm, parts.rLeg, parts.lLeg);

  applyPose();
}

/* ---------- ポーズ ---------- */
function applyPose() {
  document.querySelectorAll("[data-part]").forEach(s => {
    const p = parts[s.dataset.part];
    if (p) p.rotation.x = THREE.MathUtils.degToRad(+s.value);
  });
}
document.querySelectorAll("[data-part]").forEach(s =>
  s.addEventListener("input", applyPose)
);

/* ---------- スキン取得 ---------- */
async function fetchSkin(id) {
  const errors = [];
  for (let i = 0; i < SOURCES.length; i++) {
    const name = ["crafatar", "mc-heads", "中継(corsproxy)"][i];
    try {
      const res = await fetch(SOURCES[i](id));
      if (!res.ok) { errors.push(`${name}:${res.status}`); continue; }
      const blob = await res.blob();
      if (!blob.type.startsWith("image/")) { errors.push(`${name}:画像ではない`); continue; }
      return blob;
    } catch (e) {
      errors.push(`${name}:通信失敗(CORSの可能性)`);
    }
  }
  throw new Error("全ての取得元で失敗しました\n" + errors.join("\n"));
}

function blobToImage(blob) {
  return new Promise((ok, ng) => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); ng(new Error("画像のデコードに失敗しました")); };
    img.src = url;
  });
}

// 細腕(Slim)判定：右腕前面の右端1列が全部透明ならSlim
function detectSlim(cx) {
  const d = cx.getImageData(47, 20, 1, 12).data;
  for (let i = 3; i < d.length; i += 4) if (d[i] > 0) return false;
  return true;
}

/* ---------- メイン処理 ---------- */
async function showSkin() {
  const q = queryInput.value.trim();
  if (!q) { setStatus("MCIDまたはUUIDを入力してください", true); return; }
  if (typeof THREE === "undefined") {
    setStatus("Three.jsの読み込みに失敗しました。通信環境を確認してください", true);
    return;
  }

  // ハイフン入りUUIDはハイフンを取る。それ以外（MCID）はそのまま
  let id = q;
  const clean = q.replace(/-/g, "");
  if (/^[0-9a-fA-F]{32}$/.test(clean)) id = clean.toLowerCase();
  else if (!/^[A-Za-z0-9_]{3,16}$/.test(q)) {
    setStatus("MCIDまたはUUIDの形式が正しくありません", true);
    return;
  }

  setStatus("読み込み中...");
  try {
    const blob = await fetchSkin(id);
    const img = await blobToImage(blob);

    if (img.height !== 64) {
      throw new Error(`スキンは${img.width}×${img.height}です。旧形式(64×32)は未対応です`);
    }

    const cv = document.createElement("canvas");
    cv.width = 64; cv.height = 64;
    const cx = cv.getContext("2d");
    cx.imageSmoothingEnabled = false;
    cx.drawImage(img, 0, 0);

    const slim = detectSlim(cx);
    const tex = new THREE.CanvasTexture(cv);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.needsUpdate = true;

    previewEl.src = cv.toDataURL();
    buildModel(tex, slim);
    setStatus(`${q} （${slim ? "Slim" : "Classic"}モデル）`);
  } catch (e) {
    setStatus("エラー: " + e.message, true);
  }
}

document.getElementById("go").addEventListener("click", showSkin);
queryInput.addEventListener("keydown", e => { if (e.key === "Enter") showSkin(); });

init();
</script>
</body>
</html>
